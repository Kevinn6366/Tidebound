[project]
name = "tidebound"
version = "0.0.3"
description = "Tidebound v0.03 agent web application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "tzdata>=2025",
    "pymysql[rsa]>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["webapp/**/*.py", "src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
