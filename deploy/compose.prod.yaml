services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tidebound
      MYSQL_USER: tidebound
      MYSQL_PASSWORD: ${TIDEBOUND_MYSQL_PASSWORD:?Set TIDEBOUND_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${TIDEBOUND_MYSQL_ROOT_PASSWORD:?Set TIDEBOUND_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      TIDEBOUND_MODE: prod
      TIDEBOUND_MYSQL_HOST: mysql
      TIDEBOUND_MYSQL_PORT: "3306"
      TIDEBOUND_MYSQL_DATABASE: tidebound
      TIDEBOUND_MYSQL_USER: tidebound
      TIDEBOUND_AGENT_DATA_DIR: /app/data/agent
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${TIDEBOUND_PUBLIC_PORT:-8080}:5201"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5201/api/health', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 20

volumes:
  mysql_data:
  app_data:
