services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:53306:3306"
    environment:
      MYSQL_DATABASE: tidebound
      MYSQL_USER: tidebound
      MYSQL_PASSWORD: ${TIDEBOUND_MYSQL_PASSWORD:?Set TIDEBOUND_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TIDEBOUND_MYSQL_ROOT_PASSWORD:?Set TIDEBOUND_MYSQL_ROOT_PASSWORD}
    volumes:
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
